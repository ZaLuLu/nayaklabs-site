<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Nayak Labs — AI Product Studio & Engineering Fellowship</title>
    <meta name="title" content="Nayak Labs — AI Product Studio & Engineering Fellowship" />
    <meta name="description" content="We engineer autonomous AI systems, high-scale web platforms, and mentor serious developers through live 12-seat engineering cohorts. 100% IP transfer." />
    <link rel="canonical" href="https://nayaklabs.com/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nayaklabs.com/" />
    <meta property="og:title" content="Nayak Labs — AI Product Studio & Engineering Fellowship" />
    <meta property="og:description" content="We engineer autonomous AI systems, high-scale web platforms, and mentor serious developers through live 12-seat cohorts." />
    <meta property="og:image" content="https://nayaklabs.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://nayaklabs.com/" />
    <meta property="twitter:title" content="Nayak Labs — AI Product Studio & Engineering Fellowship" />
    <meta property="twitter:description" content="We engineer autonomous AI systems, high-scale web platforms, and mentor serious developers." />
    <meta property="twitter:image" content="https://nayaklabs.com/og-image.jpg" />

    <!-- Google Fonts: Outfit + Plus Jakarta Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Synchronous FOUC Prevention Script -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('nayaklabs-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
